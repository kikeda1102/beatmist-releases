  プレイリスト管理のコツを紹介します。

  フォルダでジャンルや現場ごとに楽曲を整理し、rekordboxのプレイリスト情報をBeatMistで確認できます。フォルダ構成とプレイリストを揃えておくと、管理がスムーズになります。

  #BeatMist #DJ #rekordbox
  https://beatmist.com
