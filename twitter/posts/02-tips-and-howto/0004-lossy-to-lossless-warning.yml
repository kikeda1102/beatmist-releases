content: |
  MP3などのロッシー音源をAIFFやWAVに変換しても、音質は向上しません。失われた情報は復元できないためです。

  BeatMistはこのケースを自動で検出し、不要な変換をスキップします。ファイルサイズの無駄な増加を防ぎます。

