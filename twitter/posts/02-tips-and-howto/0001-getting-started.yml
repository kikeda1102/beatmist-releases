content: |
  BeatMistの使い方はたった3ステップです。

  1. アプリをダウンロード
  2. 楽曲フォルダを登録
  3. CDJ機種を選んで変換ボタンを押す

  これだけで、対応フォーマットへの変換が完了します。難しい設定は不要です。

  #BeatMist #DJ #CDJ
  https://beatmist.com
