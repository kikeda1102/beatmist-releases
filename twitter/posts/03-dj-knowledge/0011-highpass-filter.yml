  【DJ / DTM情報】ハイパスフィルター（ローカット）の重要性

  ミックスがモワモワする原因の多くは、不要な低域の蓄積です

  ・ボーカル、ハイハット、シンセリードなど低域が不要なトラックに80〜100Hzでローカットをかける
  ・キックやベース以外のトラックは、意外と不要な低域を含んでいる
  ・これだけでミックス全体の見通しが大きく改善する

  地味ですが、プロのエンジニアが最初にやる処理の一つです

  #DJ #DTM #EQ #ミキシング
