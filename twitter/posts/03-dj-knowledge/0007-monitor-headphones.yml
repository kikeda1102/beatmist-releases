  【DJ / DTM情報】モニターヘッドホンとリスニング用の違い

  モニターヘッドホン: 音の味付けが少なく、各帯域をフラットに再生する。ミックスの粗が見えやすい
  リスニング用ヘッドホン: 低音を強調するなど、聴いて心地よい音作りがされている

  制作やミキシングではモニターヘッドホンが必須です。リスニング用で作ると、他の環境で聴いたときにバランスが崩れます

  #DJ #DTM #モニターヘッドホン #機材
