content: |
  楽曲が1000曲を超えたら、ライブラリ管理が必須です。

  ・ジャンル/BPM/年代でフォルダを整理
  ・ファイル名の命名規則を統一
  ・アーティスト名やタグ情報を正確に入力

  管理を怠ると、現場で目当ての曲が見つからない事態になります。日頃の整理が選曲力に直結します。

  #DJ #楽曲管理 #rekordbox
