  【DJ / DTM情報】EQミキシングとローの入れ替え

  DJミックスでよくある失敗: 2曲のローが同時に鳴って音が破綻する

  解決策はEQでのロー入れ替え:
  ・次の曲を入れる前に、その曲のローをカットしておく
  ・曲を切り替えるタイミングでローを入れ替える（片方をカット→もう片方を戻す）

  クロスフェーダーだけで繋ごうとすると、低域が重なる瞬間が必ず生まれます。EQを使った入れ替えはスムーズなミックスの基本です

  #DJ #EQ #DJテクニック #ミキシング
