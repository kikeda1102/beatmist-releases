  【DJ / DTM情報】Camelot Wheelでキーハーモニーを意識した選曲

  曲のKeyが合わないと、ミックス時に不協和音が生まれます。Camelot表記を使うと相性が簡単にわかります

  ・隣の数字に移動（例: 8A→7A、8A→9A）= 自然で違和感のないつなぎ
  ・同じ数字でAとBを切り替え（例: 8A→8B）= エモーショナルな変化

  rekordboxやTraktorはCamelot/Open Key表記に対応しています。ライブラリ画面でKey列を表示して活用してみてください

  #DJ #CamelotWheel #ハーモニックミキシング
