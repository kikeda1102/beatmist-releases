content: |
  rekordboxのバックアップ、取っていますか？

  PC故障やSSD破損が起きると、以下がすべて消失します。

  ・プレイリスト
  ・CUEポイント
  ・ビートグリッド
  ・楽曲の評価やコメント

  定期的なバックアップで、積み重ねたデータを守りましょう。

  #DJ #rekordbox #バックアップ
