  【DJ / DTM情報】セットのエネルギーカーブ

  良いDJセットには「流れ」があります。意識したいのがエネルギーカーブ

  ・序盤で飛ばしすぎない。上げ幅がなくなってフロアが疲れる
  ・山と谷を作る。ずっと全開だと抑揚がなくなる
  ・ピークタイムに向けて段階的にエネルギーを上げていく

  1時間のセットなら、最初の15分で雰囲気を作り、中盤で一度落とし、後半に向けて盛り上げる構成が王道です

  #DJ #セットリスト #DJテクニック
