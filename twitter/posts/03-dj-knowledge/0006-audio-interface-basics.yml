  【DJ / DTM情報】オーディオインターフェースの選び方

  DTMを始めるとき、最初に迷うのがオーディオインターフェース

  選ぶポイント:
  ・レイテンシー（遅延）が小さいこと。演奏や録音の快適さに直結する
  ・ドライバの安定性。安価でも不安定だとノイズやフリーズの原因に
  ・入出力数は用途で決める。宅録なら2in/2outで十分

  USB接続のもので問題ありません。最初の1台は定番メーカーから選ぶのが安心です

  #DJ #DTM #オーディオインターフェース #機材
