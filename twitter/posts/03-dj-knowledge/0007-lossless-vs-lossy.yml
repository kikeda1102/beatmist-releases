  ロスレスとロッシー、DJはどちらを選ぶべきでしょうか？

  ロスレス（WAV/AIFF/FLAC）：音質劣化なし。容量は大きい
  ロッシー（MP3/AAC）：容量は軽いが音質は劣化

  結論としては、MP3でも320kbpsあればクラブのサウンドシステムで十分に通用します。

  #DJ #音質 #ロスレス #MP3
