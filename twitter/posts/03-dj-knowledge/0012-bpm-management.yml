content: |
  BPM管理はスムーズな選曲の基本です。

  主要ジャンルのBPM帯の目安：
  ・House：120〜130
  ・Techno：125〜140
  ・D&B：170〜180
  ・Hip-Hop：85〜100

  BPMでソートしておくと、次の曲を素早く選べます。±3BPM以内なら自然なつなぎが可能です。

  #DJ #BPM #選曲 #ミックス
