  イベント前の楽曲準備チェックリストです。

  ☑ 会場CDJの機種と対応フォーマットを確認
  ☑ 全曲のCUEポイントを設定済みか確認
  ☑ プレイリストを作成・整理
  ☑ USBにエクスポート完了
  ☑ 予備USBも準備

  前日の夜ではなく、余裕を持って準備しましょう。

  #DJ #CDJ #イベント準備 #rekordbox
