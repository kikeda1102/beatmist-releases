content: |
  WAV・AIFF・MP3の違いをご存知ですか？

  WAV：ロスレス。タグ情報の扱いが不安定
  AIFF：ロスレス。タグ対応が安定しCDJとの相性も良好
  MP3：ロッシー。容量は軽いが音質は劣化

  現場で使うなら、AIFFが最も安定した選択肢です。

  #DJ #CDJ #rekordbox #音楽フォーマット
