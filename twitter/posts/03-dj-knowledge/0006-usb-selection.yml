  DJ用USBメモリの選び方をまとめました。

  ・USB 3.0以上（読み込み速度が安定）
  ・容量は32GB以上を推奨
  ・SanDiskやSamsungなど信頼できるメーカー
  ・FAT32でフォーマット
  ・予備のUSBも必ず持参

  現場でのトラブル防止には、USBの品質が重要です。

  #DJ #CDJ #USB #イベント準備
