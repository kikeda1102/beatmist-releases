content: |
  CDJ機種によって対応フォーマットが異なることをご存知ですか？

  CDJ-3000：WAV/AIFF/MP3/AAC/FLAC/ALAC対応
  CDJ-2000NXS2：WAV/AIFF/MP3/AAC対応
  CDJ-2000NXS以前：FLAC/ALACは非対応

  会場のCDJ機種を事前に確認し、対応フォーマットで準備することが大切です。

  #DJ #CDJ #FLAC #フォーマット
