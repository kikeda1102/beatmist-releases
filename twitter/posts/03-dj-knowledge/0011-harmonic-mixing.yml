  ハーモニックミキシングをご存知ですか？

  楽曲のKeyを意識してつなぐテクニックです。Camelot表記を使うと簡単に判断できます。

  ・隣の数字（例：8A→7Aや9A）で自然なつなぎ
  ・同じ数字のAとB（例：8Aと8B）でエモーショナルな変化

  Keyの合わない曲をつなぐと違和感が生まれます。

  #DJ #ハーモニックミキシング #Camelot
