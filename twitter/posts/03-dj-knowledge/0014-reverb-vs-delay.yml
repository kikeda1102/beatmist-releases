  【DJ / DTM情報】リバーブとディレイの使い分け

  どちらも「残響」を作るエフェクトですが、性質が違います

  リバーブ: 空間の広がりを演出する。部屋やホールの響きを再現
  ディレイ: 音の繰り返し（やまびこ）でリズム感のある残響を作る

  使い分けの目安:
  ・空間に奥行きを出したい → リバーブ
  ・リズムに絡む効果がほしい → ディレイ

  どちらもかけすぎると音が濁ります。センドで薄くかけるのが基本です

  #DJ #DTM #リバーブ #ディレイ #エフェクト
